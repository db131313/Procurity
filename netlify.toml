# Procurity.Pro — Netlify hosting
# Site: https://rococo-scone-8d41f1.netlify.app
# Domain: https://procurity.pro

[build]
  command = "npm run build"
  publish = ".next"

# Firebase web API keys are intentionally public (NEXT_PUBLIC_*).
# Smart detection flags AIza… values inside Next/Netlify build output.
# SECRETS_SCAN_OMIT_PATHS matches the prior Netlify-dashboard fix for this site.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID"
  SECRETS_SCAN_OMIT_PATHS = ".netlify,.next,node_modules"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  included_files = ["prisma/**"]
  node_bundler = "esbuild"

# Default Netlify function timeout is too short for DOB ingest.
[functions."*"]
  timeout = 60

# Deploy-preview only: allow a known QA email so agents can verify /admin/dev-plan.
# Production uses ADMIN_EMAILS / ADMIN_EMAIL (Netlify UI) plus server bootstrap owners.
[context.deploy-preview.environment]
  ADMIN_EMAIL = "devplan-preview-admin@example.com"
