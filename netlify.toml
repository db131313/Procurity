# Domain: https://procurity.pro

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  included_files = ["prisma/**"]
  node_bundler = "esbuild"

# Default Netlify function timeout is too short for DOB ingest.
[functions."*"]
  timeout = 60
